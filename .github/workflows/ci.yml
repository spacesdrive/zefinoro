name: CI

# Runs on every push and pull request. Deployment lives in deploy.yml and waits
# on this workflow succeeding, so a red build can never reach production.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: backend
        run: npx vitest run --reporter=verbose

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose

      # Proves the bundle compiles. The values are placeholders: Vite inlines
      # VITE_* at build time, and the real ones are injected by deploy.yml.
      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A cheap, targeted backstop for the credentials this project actually
      # uses. It checks tracked files only, so ignored env files are irrelevant.
      - name: Fail if a live credential was committed
        run: |
          set -euo pipefail
          patterns='sbp_[a-z0-9]{40}|cfat_[A-Za-z0-9]{40}|GOCSPX-[A-Za-z0-9_-]{20,}|service_role'
          if git grep -nIE "$patterns" -- . ':!*.example' ':!.github/workflows/*'; then
            echo "::error::A credential pattern was found in tracked files."
            exit 1
          fi
          echo "No credential patterns found in tracked files."
